# LibrePods HiiT: builds the Linux app as an AppImage. Built on Ubuntu 22.04 (glibc 2.35)
# so it runs on distributions from about 2022 on, with Qt 6.8 LTS bundled.
# Tags starting with "v" also publish the AppImage as a GitHub release asset.
name: Build LibrePods Linux (AppImage)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['linux/**', '.github/workflows/ci-linux.yml']
  pull_request:
    paths: ['linux/**', '.github/workflows/ci-linux.yml']

permissions:
  contents: write # release upload on tags

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build \
            libssl-dev libpulse-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtconnectivity qtwaylandcompositor'
          cache: true

      - name: Build AppImage
        working-directory: linux
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: ./packaging/build-appimage.sh "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrePods-HiiT-x86_64.AppImage
          path: dist/LibrePods-HiiT-x86_64.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LibrePods-HiiT-x86_64.AppImage
          generate_release_notes: true
